<header class="intro"><div><h1>每个应用，都有顺手的按键<span class="badge">交互原型</span></h1><p>试试看：应用只覆盖需要修改的键，其余跟随默认；切到别的应用，键位随之切换。此页面只模拟行为，刷新即重置，不连接遥控器或发送系统按键。</p></div><button id="reset-demo">重置演示</button></header>

  <nav class="tabs" aria-label="设置页面"><span>连接</span><span class="active">按键</span><span>权限</span><span>支持设备</span></nav>
  <div class="layout">
    <aside class="sidebar"><div class="eyebrow">编辑键位</div><div id="app-list"></div><div class="divider"></div><button class="add-app quiet" id="add-app">＋ 添加应用</button><p>从左侧选择要编辑的应用。<br>编辑选择与前台应用独立。</p></aside>

<script>
// The mapping model is independent of the demo UI and owns no native side effects.
const KeymapModel = (() => {
  const defaults = {mic:'fn',power:'esc',up:'up',left:'left',ok:'enter',right:'right',down:'down',back:'delete',volumeUp:'volumeUp',home:'desktop',volumeDown:'volumeDown',menu:'context',tv:'switcher'};
  const repeatable = ['up','down','left','right','back','volumeUp','volumeDown'];
  const apps = {
    iina:{name:'IINA',icon:'▶',color:'#7366b8'},chrome:{name:'Google Chrome',icon:'◉',color:'#4789d9'},
    code:{name:'Visual Studio Code',icon:'⌘',color:'#2985c1'},finder:{name:'访达',icon:'☺',color:'#5b99d6'},
    safari:{name:'Safari',icon:'↗',color:'#328cc7'},keynote:{name:'Keynote',icon:'▤',color:'#4e9ccc'},terminal:{name:'终端',icon:'›_',color:'#535967'}
  };
  function initial(){return {base:{...defaults},profiles:{iina:{ok:'space',left:'left',right:'right',back:'esc'},chrome:{left:'cmd+[',right:'cmd+]'},code:{ok:'cmd+p'}},editing:'iina',front:'iina',key:'ok',automatic:true,held:null,voice:false,events:[],notice:'正在编辑 IINA；右侧模拟前台应用为 IINA。修改后会立即反映在原型中。'};}
  function resolve(s,key){
    if(key==='mic')return {value:s.base.mic,source:'全局语音键'};
    const profile=s.automatic?s.profiles[s.front]:null;
    if(profile&&Object.hasOwn(profile,key))return {value:profile[key],source:apps[s.front].name+' 专属'};
    return {value:s.base[key],source:'默认键位'};
  }
  function emit(s,text){s.events.unshift(text);s.events=s.events.slice(0,4);s.notice=text;}
  function cancelHeld(s,why){if(s.held){emit(s,why+'，已停止「'+s.held.label+'」连发；松开再按才会继续。');s.held=null;}}
  function reduce(previous,action){
    const s=JSON.parse(JSON.stringify(previous));
    switch(action.type){
      case 'edit':s.editing=action.app;s.notice='正在编辑 '+(action.app==='default'?'默认键位':apps[action.app].name)+'；右侧前台应用保持不变。';break;
      case 'select':s.key=action.key;break;
      case 'front':if(s.front!==action.app){cancelHeld(s,'前台应用已切换');s.front=action.app;if(!previous.held)emit(s,'前台切换到 '+apps[s.front].name+'，'+(s.automatic&&s.profiles[s.front]?'已匹配应用键位。':'使用默认键位。'));}break;
      case 'automatic':cancelHeld(s,'自动切换设置已改变');s.automatic=action.enabled;s.notice=s.automatic?'已开启自动匹配；未配置的应用使用默认键位。':'已关闭自动匹配；所有应用使用默认键位。';break;
      case 'bind':{
        if(action.key==='mic'&&s.editing!=='default')break;
        if(action.key==='mic'&&s.voice){s.notice='请先松开语音键，再修改语音动作。';break;}
        cancelHeld(s,'键位已修改');
        const target=s.editing==='default'?s.base:s.profiles[s.editing];
        if(action.value==='inherit')delete target[action.key];else target[action.key]=action.value;
        s.notice=action.value==='inherit'?'此键已改为跟随默认。':'键位已在原型中更新。';break;
      }
      case 'resetProfile':if(s.editing==='default'&&s.voice){s.notice='请先松开语音键，再恢复默认键位。';break;}cancelHeld(s,'键位已重置');if(s.editing==='default')s.base={...defaults};else s.profiles[s.editing]={};s.notice=s.editing==='default'?'已恢复默认键位。':'此应用的普通键已全部跟随默认。';break;
      case 'add':if(!s.profiles[action.app])s.profiles[action.app]={};s.editing=action.app;s.notice='已添加 '+apps[action.app].name+'，所有普通键先跟随默认。';break;
      case 'remove':{
        const app=s.editing;if(app==='default')break;
        if(app===s.front)cancelHeld(s,'当前应用的方案已移除');
        delete s.profiles[app];s.editing='default';s.notice='已移除 '+apps[app].name+' 的方案；该应用使用默认键位。';break;
      }
      case 'tap':{s.key=action.key||s.key;const r=resolve(s,s.key);emit(s,{key:s.key,value:r.value,source:r.source});break;}
      case 'hold':if(s.key==='mic'){if(s.base.mic==='disabled'){emit(s,'语音键已全局禁用。');break;}s.voice=true;emit(s,'语音键按下；使用全局语音行为，切应用不改变本次语音。');}else if(repeatable.includes(s.key)){const r=resolve(s,s.key);if(r.value==='disabled'){emit(s,'此键已禁用，不会开始连发。');break;}s.held={key:s.key,value:r.value,label:action.label,count:1};emit(s,'开始模拟连发：'+action.label+'。');}break;
      case 'tick':if(s.held)s.held.count++;break;
      case 'release':if(s.voice){s.voice=false;emit(s,'语音键松开；已结束同一次全局语音。');}else if(s.held){s.held=null;emit(s,'按键已松开，连发停止。');}break;
    }
    return s;
  }
  return {initial,resolve,reduce,apps,repeatable};
})();

const keys=[['mic','语音键','●'],['power','电源键','⏻'],['up','上键','↑'],['left','左键','←'],['ok','确定键','OK'],['right','右键','→'],['down','下键','↓'],['back','返回键','↩'],['volumeUp','音量 +','＋'],['home','主页键','⌂'],['volumeDown','音量 −','−'],['menu','菜单键','☰'],['tv','TV 键','TV']];
const actions={fn:'硬件 Fn · 按住语音',disabled:'禁用',esc:'Escape',enter:'Return',up:'方向上',down:'方向下',left:'方向左',right:'方向右',delete:'Delete（退格）',desktop:'显示桌面',context:'上下文菜单',switcher:'切换应用 ⌘Tab',volumeUp:'系统音量 +',volumeDown:'系统音量 −',mute:'系统静音',playPause:'播放 / 暂停',space:'空格','cmd+[':'⌘[','cmd+]':'⌘]','cmd+p':'⌘P'};
let state=KeymapModel.initial(), walk=0, step=-1;
const $=id=>document.getElementById(id);
$('device-photo').src=remotePhoto;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionName=value=>actions[value]||value;
const eventText=event=>typeof event==='string'?event:keys.find(k=>k[0]===event.key)[1]+' → '+actionName(event.value)+'（'+event.source+'）';
const appName=id=>id==='default'?'默认键位':KeymapModel.apps[id].name;
function icon(id,large=false){const a=id==='default'?{icon:'⌘',color:'#929ba9'}:KeymapModel.apps[id];return '<span class="app-icon '+(large?'large':'')+'" style="--app-color:'+a.color+'">'+a.icon+'</span>';}
function send(action){
  state=KeymapModel.reduce(state,action);
  if(action.type==='tick'){
    if(state.held)$('hold-status').textContent='正在连发 '+state.held.label+' · 已模拟 '+state.held.count+' 次';
    return;
  }
  render();
}
function render(){
  $('automatic').checked=state.automatic;
  $('app-list').innerHTML=['default',...Object.keys(state.profiles)].map(id=>'<button class="app-row '+(id===state.editing?'selected':'')+'" data-edit="'+id+'" aria-pressed="'+(id===state.editing)+'">'+icon(id)+'<span><strong>'+appName(id)+'</strong><small>'+(id==='default'?'适用于所有未覆盖的按键':Object.keys(state.profiles[id]).length+' 个专属键位')+'</small></span></button>').join('');
  $('editor-head').innerHTML='<div class="name">'+icon(state.editing,true)+'<div><h2>'+appName(state.editing)+'</h2><p>'+(state.editing==='default'?'作为所有应用的基础键位':'只修改这个应用中需要不同的按键')+'</p></div></div><span class="pill">正在编辑</span>';
  $('editor-note').textContent=state.editing==='default'?'修改默认键位，会同步影响所有“跟随默认”的按键。':'未单独设置的键始终跟随默认。语音键在所有应用中保持一致，可在默认键位中修改。';
  $('mappings').innerHTML=keys.map(([key,name])=>{
    const global=state.editing==='default', voice=key==='mic';
    const override=!global&&!voice&&Object.hasOwn(state.profiles[state.editing],key);
    const value=global||voice?state.base[key]:(override?state.profiles[state.editing][key]:'inherit');
    const options=voice?['fn','disabled']:Object.keys(actions).filter(a=>a!=='fn');
    if(!options.includes(value)&&value!=='inherit')options.push(value);
    const inherit=!global&&!voice?'<option value="inherit" '+(value==='inherit'?'selected':'')+'>跟随默认 · '+escapeHTML(actionName(state.base[key]))+'</option>':'';
    return '<div class="mapping-row '+(state.key===key?'focused':'')+'"><span class="key-name">'+name+'</span><select data-binding="'+key+'" aria-label="'+name+'的动作" '+(voice&&!global?'disabled':'')+'>'+inherit+options.map(v=>'<option value="'+escapeHTML(v)+'" '+(v===value?'selected':'')+'>'+escapeHTML(actionName(v))+'</option>').join('')+'<option value="custom">自定义快捷键…</option></select><span class="origin '+(override?'override':'')+'">'+(voice?'全局':global?'默认':override?'专属':'跟随默认')+'</span></div>';
  }).join('');
  $('remove-app').classList.toggle('hidden',state.editing==='default');
  $('reset-profile').textContent=state.editing==='default'?'恢复默认键位':'全部跟随默认';
  $('front-app').innerHTML=Object.keys(KeymapModel.apps).map(id=>'<option value="'+id+'" '+(id===state.front?'selected':'')+'>'+appName(id)+(state.profiles[id]?'':' · 未配置')+'</option>').join('');
  const matched=state.automatic&&Object.hasOwn(state.profiles,state.front);
  $('effective-name').textContent=matched?appName(state.front):'默认键位';
  $('effective-detail').textContent=!state.automatic?'自动切换已关闭':matched?'已匹配 · 未覆盖的键跟随默认':'未配置此应用 · 自动回到默认';
  $('remote').innerHTML='<img src="'+remotePhoto+'" alt="小米蓝牙语音遥控器 2 Pro（RC003）实物照片" draggable="false">'+keys.map(([key,name])=>{
    const [x,y,w,h]=hotspots[key];
    return '<button data-key="'+key+'" class="'+(state.key===key?'selected ':'')+(key==='mic'&&state.voice?'voice-active':'')+'" style="left:'+x*100+'%;top:'+y*100+'%;width:'+w*100+'%;height:'+h*100+'%" aria-label="选择'+name+'" title="'+name+'" aria-pressed="'+(state.key===key)+'"></button>';
  }).join('');
  const resolved=KeymapModel.resolve(state,state.key);
  $('preview-key').textContent=appName(state.front)+' · '+keys.find(k=>k[0]===state.key)[1];
  $('preview-action').textContent=actionName(resolved.value);
  $('preview-origin').textContent=resolved.source+' · 此处显示实际生效的模拟动作';
  $('tap-key').disabled=state.key==='mic';
  $('hold-key').textContent=state.key==='mic'?'按住语音':'按住连发';
  $('hold-key').disabled=Boolean(state.held||state.voice)||(state.key!=='mic'&&!KeymapModel.repeatable.includes(state.key));
  $('release-key').disabled=!state.held&&!state.voice;
  $('hold-status').textContent=state.voice?'语音键仍按住 · 应用切换不改写本次语音':state.held?'正在连发 '+state.held.label+' · 已模拟 '+state.held.count+' 次':'当前没有按住的键';
  $('events').innerHTML=state.events.length?state.events.map(e=>'<div class="event">'+escapeHTML(eventText(e))+'</div>').join(''):'<div class="event muted">试着按一下遥控器的确定键。</div>';
  $('notice').textContent=eventText(state.notice);
  renderWalk();
}

const scenarios=[
  {name:'应用切换',title:'同一个确定键，在不同应用中做不同的事',description:'IINA 将确定键设为空格；Chrome 没有覆盖确定键，会使用默认 Return。',steps:[['切到 IINA',{type:'front',app:'iina'}],['按一下确定键',{type:'tap',key:'ok'}],['切到 Chrome',{type:'front',app:'chrome'}],['再按确定键',{type:'tap',key:'ok'}]]},
  {name:'默认继承',title:'改一次默认，所有跟随默认的键一起变',description:'在默认键位里禁用音量 +。IINA 没覆盖这个键，因此会一起禁用；它专属的确定键仍为空格。',steps:[['编辑默认键位',{type:'edit',app:'default'}],['默认禁用音量 +',{type:'bind',key:'volumeUp',value:'disabled'}],['查看 IINA',{type:'edit',app:'iina'}],['试一下音量 +',{type:'select',key:'volumeUp'}],['按一下音量 +',{type:'tap',key:'volumeUp'}]]},
  {name:'按住时切换',title:'应用切走后，旧动作不再连发',description:'在 IINA 按住右键，再切到 Chrome。旧连发会停止，需要松开再按，才使用 Chrome 的 ⌘]。',steps:[['选择右键',{type:'select',key:'right'}],['在 IINA 按住右键',{type:'hold',label:'方向右'}],['保持按住，切到 Chrome',{type:'front',app:'chrome'}],['重新按一下右键',{type:'tap',key:'right'}]]},
  {name:'语音保持一致',title:'语音不会因切换应用而更换快捷键',description:'按住语音键后切到别的应用，仍保持同一次全局语音，松开才结束。这里不会录音或调用输入法。',steps:[['选择语音键',{type:'select',key:'mic'}],['按住语音键',{type:'hold',label:'语音'}],['切到 Chrome',{type:'front',app:'chrome'}],['松开语音键',{type:'release'}]]}
];
function renderWalk(){
  $('walk-tabs').innerHTML=scenarios.map((s,i)=>'<button role="tab" aria-selected="'+(i===walk)+'" class="'+(i===walk?'active':'')+'" data-walk="'+i+'">'+s.name+'</button>').join('');
  const s=scenarios[walk];$('walk-title').textContent=s.title;$('walk-description').textContent=s.description;
  $('walk-next').textContent=step<0?'开始演示':step<s.steps.length?s.steps[step][0]:'重新演示';
  $('walk-progress').textContent=step<0?'开始演示会重置当前试改的键位。也可以直接在上方自由操作。':step<s.steps.length?'第 '+(step+1)+' / '+s.steps.length+' 步 · 也可以随时在上方自由操作。':'演示完成。继续试改键位，或选择其他情况。';
}
function closeModal(){$('modal-root').innerHTML='';}
function openAdd(){
  const candidates=Object.keys(KeymapModel.apps).filter(id=>!state.profiles[id]);
  $('modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">添加应用</h2><p>原型使用示例应用。正式版本会从 Mac 上选择应用。</p><div class="choices">'+candidates.map(id=>'<button data-add="'+id+'">'+appName(id)+'</button>').join('')+'</div><div class="actions"><button data-close>取消</button></div></section></div>';
  $('modal-root').querySelector('button').focus();
}
function openCustom(key){
  const globalMic=key==='mic';
  $('modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">自定义快捷键</h2><p>'+keys.find(k=>k[0]===key)[1]+' · '+(globalMic?'所有应用共用':appName(state.editing))+'。选择修饰键，再填写一个按键。</p><div class="modifiers">'+[['⌘','cmd'],['⌥','alt'],['⌃','ctrl'],['⇧','shift']].map(([name,id])=>'<label><input type="checkbox" name="modifier" value="'+id+'"> '+name+'</label>').join('')+'</div><label>按键 <input id="custom-key" class="key-input" type="text" maxlength="16" placeholder="例如 P、F8、Space" autocomplete="off"></label><div class="actions"><button data-close>取消</button><button class="primary" id="save-custom">应用到原型</button></div></section></div>';
  $('custom-key').focus();
  $('save-custom').onclick=()=>{
    const keyValue=$('custom-key').value.trim();if(!keyValue){$('custom-key').focus();return;}
    const modifiers=[...$('modal-root').querySelectorAll('input[name=modifier]:checked')].map(el=>el.value);
    const value=modifiers.concat(keyValue.toUpperCase()).join('+');
    send({type:'bind',key,value});closeModal();
  };
}
document.addEventListener('click',e=>{
  const edit=e.target.closest('[data-edit]'),key=e.target.closest('[data-key]'),tab=e.target.closest('[data-walk]'),add=e.target.closest('[data-add]');
  if(edit)send({type:'edit',app:edit.dataset.edit});
  if(key)send({type:'select',key:key.dataset.key});
  if(tab){walk=Number(tab.dataset.walk);step=-1;renderWalk();}
  if(add){send({type:'add',app:add.dataset.add});closeModal();}
  if(e.target.closest('[data-close]'))closeModal();
});
$('automatic').onchange=e=>send({type:'automatic',enabled:e.target.checked});
$('front-app').onchange=e=>send({type:'front',app:e.target.value});
$('mappings').onchange=e=>{const key=e.target.dataset.binding;if(!key)return;if(e.target.value==='custom'){render();openCustom(key);}else send({type:'bind',key,value:e.target.value});};
$('add-app').onclick=openAdd;
$('reset-profile').onclick=()=>send({type:'resetProfile'});
$('remove-app').onclick=()=>send({type:'remove'});
$('tap-key').onclick=()=>send({type:'tap'});
$('hold-key').onclick=()=>send({type:'hold',label:actionName(KeymapModel.resolve(state,state.key).value)});
$('release-key').onclick=()=>send({type:'release'});
$('reset-demo').onclick=()=>{state=KeymapModel.initial();step=-1;closeModal();render();};
$('walk-next').onclick=()=>{const s=scenarios[walk];if(step<0||step>=s.steps.length){state=KeymapModel.initial();step=0;render();return;}send(s.steps[step][1]);step++;renderWalk();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
setInterval(()=>{if(state.held)send({type:'tick'});},180);
render();
</script>
